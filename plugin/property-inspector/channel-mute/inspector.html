<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Channel Mute Settings</title>
  <link rel="stylesheet" href="../../libs/css/uspi.css" />
  <link rel="stylesheet" href="../shared.css" />
</head>
<body data-actionid="com.ulanzi.ulanzistudio.wavelink.channel-mute">
  <div class="uspi-wrapper">
  <form id="property-inspector">
  <h1>Channel Mute</h1>
  <p class="sub">Toggle mute for a Wave Link channel</p>

  <section>
    <legend>Scope</legend>
    <label>
      <span>Channel</span>
      <select id="channel" name="channelId"></select>
    </label>
    <label>
      <span>Mix</span>
      <select id="mix" name="mixId"></select>
    </label>
    <p class="hint">No mix mutes the whole channel. A mix mutes only that channel's junction in it.</p>
    <label>
      <span>Behaviour on press</span>
      <select name="behaviour">
        <option value="toggle">Toggle</option>
        <option value="mute">Mute</option>
        <option value="unmute">Unmute</option>
      </select>
    </label>
  </section>

  <section>
    <legend>Status</legend>
    <div class="status" id="conn-status">
      <span class="dot"></span>
      <span class="label">Disconnected</span>
    </div>
  </section>

  </form>
  </div>
  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanziApi.js"></script>
  <script src="../shared.js?v=5"></script>
  <script src="inspector.js"></script>
</body>
</html>
