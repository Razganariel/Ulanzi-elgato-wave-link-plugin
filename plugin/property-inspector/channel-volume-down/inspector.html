<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Channel Volume Down Settings</title>
  <link rel="stylesheet" href="../../libs/css/uspi.css" />
  <link rel="stylesheet" href="../shared.css" />
</head>
<body data-actionid="com.ulanzi.ulanzistudio.wavelink.channel-volume-down">
  <div class="uspi-wrapper">
  <form id="property-inspector">
  <h1>Channel Volume Down</h1>
  <p class="sub">Each press decreases channel volume by one step</p>

  <section>
    <legend>Channel</legend>
    <label>
      <span>Channel</span>
      <select id="channel" name="channelId"></select>
    </label>
    <label>
      <span>Mix (optional)</span>
      <select id="mix" name="mixId"></select>
    </label>
  </section>

  <section>
    <legend>Step Size</legend>
    <label>
      <span>Volume step</span>
      <select name="step">
        <option value="0.01">1 % (fine)</option>
        <option value="0.02">2 %</option>
        <option value="0.05" selected>5 % (default)</option>
        <option value="0.1">10 %</option>
        <option value="0.25">25 % (coarse)</option>
      </select>
    </label>
    <label>
      <span>Min</span>
      <input type="number" name="min" min="0" max="1" step="0.01" value="0">
    </label>
    <label>
      <span>Max</span>
      <input type="number" name="max" min="0" max="1" step="0.01" value="1">
    </label>  </section>


  <section>
    <legend>Status</legend>
    <div class="status" id="conn-status">
      <span class="dot"></span>
      <span class="label">Disconnected</span>
    </div>
  </section>

  </form>
  </div>
  <script src="../../libs/js/constants.js"></script>
  <script src="../../libs/js/eventEmitter.js"></script>
  <script src="../../libs/js/timers.js"></script>
  <script src="../../libs/js/utils.js"></script>
  <script src="../../libs/js/ulanziApi.js"></script>
  <script src="../shared.js?v=7"></script>
  <script src="inspector.js"></script>
</body>
</html>
